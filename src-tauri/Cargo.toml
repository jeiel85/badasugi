[package]
name = "badasugi"
description = "받아쓰기 — 가볍고 빠른 한국어 회의 전사 앱"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "badasugi"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
badasugi-core = { path = "../crates/badasugi-core" }
tauri = { version = "2.12", features = ["tray-icon", "image-png", "custom-protocol"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "json", "blocking", "system-proxy"] }
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[features]
vulkan = ["badasugi-core/vulkan"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi"] }

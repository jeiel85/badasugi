[package]
name = "badasugi"
description = "받아쓰기 — 가볍고 빠른 한국어 회의 전사 앱"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "badasugi"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
badasugi-core = { path = "../crates/badasugi-core" }
tauri = { version = "2.12", features = ["tray-icon", "image-png", "custom-protocol", "protocol-asset"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.23"
log = "0.4"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "json", "blocking", "system-proxy"] }
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
# Word(.docx) 내보내기: zip 묶기 (deflate · crc32)
flate2 = "1"
crc32fast = "1"

[features]
vulkan = ["badasugi-core/vulkan"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_System_Power", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Input_KeyboardAndMouse"] }
# 회의 시작 알림: 입력 장치의 오디오 세션 → 마이크를 쓰는 프로세스 (cpal 과 같은 판)
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_Storage_Packaging_Appx", "Win32_System_Ole", "Win32_Globalization"] }
# PDF 내보내기: WebView2 PrintToPdf (tauri 의 wry 와 같은 판)
webview2-com = "0.39"

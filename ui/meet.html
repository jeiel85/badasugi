<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>받아쓰기 — 회의 알림</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="meet-body">
  <!-- 회의 시작 알림: 회의 앱이 마이크를 쓰기 시작하면 받아쓸지, 놓으면 멈출지 묻는다 (meeting.rs) -->
  <div class="meet" id="meet" role="alertdialog" aria-labelledby="meet-title" aria-describedby="meet-desc" hidden>
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D5DFC"/><stop offset="1" stop-color="#9F5BF6"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="16" fill="url(#lg)"/><g fill="#fff"><rect x="11" y="26" width="7" height="12" rx="3.5"/><rect x="21" y="18" width="7" height="28" rx="3.5"/><rect x="31" y="12" width="7" height="40" rx="3.5"/><rect x="41" y="22" width="13" height="7" rx="3.5"/><rect x="41" y="35" width="10" height="7" rx="3.5"/></g></svg>
    <div class="meet-main">
      <b class="meet-title" id="meet-title"></b>
      <span class="meet-desc" id="meet-desc"></span>
      <div class="meet-acts" id="meet-acts"></div>
    </div>
    <button class="meet-x" id="meet-close" title="닫기 (Esc)" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <script src="meet.js"></script>
</body>
</html>

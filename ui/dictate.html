<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>받아쓰기 — 말로 입력</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dict-body">
  <!-- 말로 입력 알림: 듣는 중 · 받아 적는 중 · 입력함 · 문제 (dictate.rs). 포커스를 가져가지 않는다 -->
  <div class="dict" id="dict" role="status" aria-live="polite">
    <span class="dict-ic" id="dict-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
    <span class="dict-txt" id="dict-txt"></span>
    <span class="dict-lv" id="dict-lv" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
  </div>
  <script src="dictate.js"></script>
</body>
</html>

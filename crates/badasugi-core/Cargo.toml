[package]
name = "badasugi-core"
description = "받아쓰기 코어: 오디오 캡처 · VAD · 화자 분리 · 음성 인식 파이프라인"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["local-whisper"]
# 로컬 whisper.cpp 엔진 (오프라인 전사)
local-whisper = ["dep:whisper-rs"]
# GPU 가속 (Vulkan SDK 필요)
vulkan = ["local-whisper", "whisper-rs?/vulkan"]

[dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
cpal = "0.18"
hound = "3.5"
# 회의 녹음 저장 (Ogg Opus: 같은 음질에 WAV 의 약 1/10 크기, libopus 는 BSD)
opus = "0.4"
ogg = "0.9"
sha2 = "0.10"
# 오디오 파일 불러오기 (필요한 형식만: wav · mp3 · m4a/mp4/mov(aac) · flac · ogg vorbis)
symphonia = { version = "0.5.5", default-features = false, features = ["wav", "pcm", "adpcm", "mp3", "aac", "isomp4", "flac", "ogg", "vorbis"] }
rustfft = "6.4"
ort = "=2.0.0-rc.15"
whisper-rs = { version = "0.16", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "charset", "system-proxy", "json", "multipart", "blocking"] }

[dev-dependencies]
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
